# Copy to ngrok-password-policy.yml and edit locally. This real file is Git-ignored.
# Choose your OWN unique, long password; do NOT leave the placeholder below.
# Safari will prompt for the ngrok username/password before showing Mini.
# You still need Mini's separate ROBOT_ACCESS_CODE inside the app.
on_http_request:
  - actions:
      - type: basic-auth
        config:
          credentials:
            - "mini:CHANGE-TO-A-STRONG-UNIQUE-PASSWORD-AT-LEAST-20-CHARACTERS"
